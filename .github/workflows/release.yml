name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Sprintly-windows.exe
          - os: ubuntu-latest
            asset: Sprintly-linux
          - os: macos-latest
            asset: Sprintly-macos.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install build tools
        run: python -m pip install pyinstaller
      - name: Build app
        run: pyinstaller --onefile --windowed --name Sprintly sprintly.py
      - name: Rename (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/Sprintly.exe dist/${{ matrix.asset }}
        shell: pwsh
      - name: Rename (Linux)
        if: runner.os == 'Linux'
        run: mv dist/Sprintly dist/${{ matrix.asset }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Sprintly.app dist/${{ matrix.asset }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true
